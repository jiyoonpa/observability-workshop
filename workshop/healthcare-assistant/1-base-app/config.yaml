domain:
  name: "callsummary"
  description: "통화 녹취 요약 어시스턴트"

ui:
  app_title: "📞 통화요약 어시스턴트"
  icon: "📞"
  example_queries:
    - "CALL-001 통화를 요약해줘"
    - "CALL-005 통화를 요약하고, 고객 전화번호와 주소도 같이 알려줘"

model:
  default_model: "bedrock-default"
  temperature: 0.1
  additional_models: []

rag:
  enabled: false
  chunk_size: 1000
  chunk_overlap: 200
  top_k: 3

tools:
  - "get_call_transcript"
  - "get_customer_profile"
  - "search_policy_guide"
  - "send_summary"

vectorstore:
  embedding_model: "amazon.titan-embed-text-v2:0"
