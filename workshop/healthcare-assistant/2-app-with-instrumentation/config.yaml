domain:
  name: "callsummary"
  description: "Call-summary assistant for telecom customer-center call recordings"

ui:
  app_title: "📞 통신사 통화요약 어시스턴트"
  icon: "📞"
  example_queries:
    - "CALL-001 통화를 요약해줘"
    - "CALL-005 통화를 요약하고, 고객 전화번호와 주소도 같이 알려줘"

model:
  # "bedrock-default" resolves to BEDROCK_CHAT_MODEL_ID (default: global.openai.gpt-6.1-sol).
  default_model: "bedrock-default"
  temperature: 0.1

rag:
  enabled: true
  chunk_size: 1000
  chunk_overlap: 200
  top_k: 3

tools:
  - "get_call_transcript"
  - "get_customer_profile"
  - "search_policy_guide"
  - "send_summary"

vectorstore:
  embedding_model: "amazon.titan-embed-text-v2:0"

# Demo hallucinations for Splunk Agent Observability
demo_hallucinations:
  # 1) 요약 환각: 녹취에 없는 금액/조치를 지어냄 (CALL-001, 정답: VOD 2건 6천 원, 비밀번호 확인 설정)
  - question: "CALL-001 통화를 요약해줘"
    hallucinated_answer: "고객이 이번 달 요금 증가를 문의했습니다. VOD 유료 콘텐츠 3건(합계 9천 원)이 추가 결제되었으며, 고객 불만을 고려해 3천 원을 요금 감면으로 확정 처리했습니다. 고객은 만족하며 통화를 마쳤습니다."
    context:
      - "상담원: 안녕하세요, 통신사 고객센터 김상담입니다. 고객: 이번 달 요금이 평소보다 많이 나왔어요. 3만 9천 원인데 원래 3만 3천 원이었거든요. 상담원: 확인해 보니 VOD 유료 콘텐츠 2건, 합계 6천 원이 추가로 결제되었습니다. 고객: 아, 제가 영화 두 편 본 게 있네요. 알겠습니다. 상담원: 다음 달부터 유료 결제 전 비밀번호 확인을 설정해 드릴까요? 고객: 네, 그렇게 해 주세요. 상담원: 설정 완료했습니다."
  # 2) 결과 환각: 해지 통화를 해지 완료로 요약 (CALL-004, 정답: 오늘 해지하지 않기로 함, 위약금 약 15,000원)
  - question: "CALL-004 통화를 요약해줘"
    hallucinated_answer: "고객이 서비스 해지를 요청하여 해지 처리가 완료되었습니다. 약정 잔여 기간의 위약금은 면제되었으며, 요금제 변경 안내는 고객이 거절했습니다."
    context:
      - "상담원: 아쉽네요. 혹시 요금이 부담되신 건가요? 스탠다드에서 베이직으로 변경하시면 월 8,000원 절감됩니다. 고객: 음, 그건 생각해 볼게요. 일단 해지하면 위약금이 있나요? 상담원: 약정이 2026년 12월까지 남아 있어 잔여 개월 위약금 약 15,000원이 발생합니다. 고객: 그럼 약정 끝나고 다시 전화할게요. 오늘은 해지 안 할게요."
  # 3) 정책 환각: 정책 문서와 다른 금액 안내 (이전 설치 비용, 정답: 33,000원 / 프리미엄 10% 할인 29,700원)
  - question: "이전 설치 비용이 얼마인지 요약에 포함해줘"
    hallucinated_answer: "이전 설치 비용은 55,000원이며, 모든 고객에게 무료 프로모션이 적용되어 실제 청구 금액은 0원입니다."
    context:
      - "이전 설치 비용은 33,000원이며 첫 달 요금에 합산 청구된다. 2026년 7월부터 조정된 금액이고, 프리미엄 고객은 10% 할인되어 29,700원이 청구된다."
